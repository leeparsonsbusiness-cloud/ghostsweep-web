<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GhostSweep Icon Generator</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      gap: 20px;
    }
    .preview-box {
      background: repeating-conic-gradient(#1e293b 0% 25%, #0f172a 0% 50%) 50% / 20px 20px;
      padding: 30px;
      border-radius: 12px;
      border: 1px solid #334155;
    }
    button {
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      border: none;
      color: white;
      font-weight: 700;
      font-size: 14px;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4);
      transition: transform 0.15s ease;
    }
    button:hover { transform: scale(1.03); }
  </style>
</head>
<body>
  <h2>GhostSweep Transparent Icon Exporter</h2>
  <div class="preview-box">
    <img id="svgPreview" width="180" height="180" alt="GhostSweep Preview">
  </div>
  <button id="downloadBtn">Export icon16, icon48, icon128 & icon512 (.PNG)</button>

  <script>
    const svgString = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
      <defs>
        <linearGradient id="ghostGrad" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#38BDF8" />
          <stop offset="50%" stop-color="#6366F1" />
          <stop offset="100%" stop-color="#2563EB" />
        </linearGradient>
        <linearGradient id="sweepGrad" x1="120" y1="400" x2="480" y2="280" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
          <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8" />
          <stop offset="100%" stop-color="#A855F7" />
        </linearGradient>
        <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#38BDF8" flood-opacity="0.35" />
        </filter>
      </defs>
      <path d="M 80 390 C 180 460, 360 450, 450 340 C 470 315, 480 270, 440 280 C 370 295, 240 370, 110 340 Z" fill="url(#sweepGrad)" />
      <path d="M 120 425 C 230 480, 370 470, 460 380" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" stroke-dasharray="16 20" opacity="0.6" />
      <g filter="url(#subtleGlow)">
        <path d="M 256 70 C 160 70, 120 150, 120 250 C 120 330, 120 410, 145 410 C 170 410, 185 375, 210 375 C 235 375, 245 410, 270 410 C 295 410, 305 375, 330 375 C 355 375, 370 410, 395 410 C 410 410, 400 330, 400 250 C 400 150, 352 70, 256 70 Z" fill="url(#ghostGrad)" />
      </g>
      <ellipse cx="205" cy="225" rx="18" ry="24" fill="#0F172A" />
      <ellipse cx="307" cy="225" rx="18" ry="24" fill="#0F172A" />
      <circle cx="212" cy="217" r="7" fill="#FFFFFF" />
      <circle cx="314" cy="217" r="7" fill="#FFFFFF" />
      <circle cx="201" cy="235" r="3.5" fill="#FFFFFF" />
      <circle cx="303" cy="235" r="3.5" fill="#FFFFFF" />
      <ellipse cx="175" cy="265" rx="14" ry="8" fill="#FFFFFF" opacity="0.25" />
      <ellipse cx="337" cy="265" rx="14" ry="8" fill="#FFFFFF" opacity="0.25" />
      <path d="M 375 110 L 385 135 L 410 145 L 385 155 L 375 180 L 365 155 L 340 145 L 365 135 Z" fill="#FACC15" />
      <path d="M 130 160 L 136 175 L 151 181 L 136 187 L 130 202 L 124 187 L 109 181 L 124 175 Z" fill="#38BDF8" opacity="0.8" />
    </svg>`;

    const blob = new Blob([svgString], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    document.getElementById('svgPreview').src = url;

    function exportPng(size, filename) {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, size, size);
        ctx.drawImage(img, 0, 0, size, size);
        
        const a = document.createElement('a');
        a.download = filename;
        a.href = canvas.toDataURL('image/png');
        a.click();
      };
      img.src = url;
    }

    document.getElementById('downloadBtn').addEventListener('click', () => {
      exportPng(16, 'icon16.png');
      setTimeout(() => exportPng(48, 'icon48.png'), 200);
      setTimeout(() => exportPng(128, 'icon128.png'), 400);
      setTimeout(() => exportPng(512, 'icon512.png'), 600);
    });
  </script>
</body>
</html>
